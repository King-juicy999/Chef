<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Menu</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4EEE2">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="name" id="header-name"></div>
    <button class="cart-btn" id="header-cart">
      <svg class="cart-icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1" /><circle cx="19" cy="21" r="1" /><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" /></svg>
      <span class="cart-badge" id="cart-badge">0</span>
    </button>
  </header>

  <section class="belt-section">
    <div class="hero">
      <div class="hero-text">
        <p class="section-label">Lunch belt</p>
        <h1 class="section-heading" id="belt-heading"></h1>
        <div class="hero-legend" id="hero-legend"></div>
        <p class="section-caption">Hover to stop the belt, flick to spin it, pick a plate to order.</p>
        <button class="btn-see-full" id="see-full-menu">See full menu</button>
      </div>
      <div class="belt-container"></div>
    </div>
  </section>

  <main>
    <ul class="menu-grid" id="menu-grid"></ul>
  </main>

  <footer>
    <p id="footer-address"></p>
    <p id="footer-hours"></p>
    <a class="btn-whatsapp" id="footer-whatsapp" target="_blank" rel="noopener"></a>
  </footer>

  <div class="cart-drawer" id="cart-drawer">
    <div class="header">
      <span>My order</span>
      <button class="close" aria-label="Close drawer">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </div>
    <div class="items" id="cart-items"></div>
    <div class="actions">
      <span class="total">₦0</span>
      <button class="action-btn checkout" id="checkout-btn">Checkout</button>
    </div>
    <form id="delivery-form">
      <input placeholder="Name" required />
      <input placeholder="Phone" required />
      <input placeholder="Delivery address" required />
      <button type="submit" class="checkout">Place order</button>
    </form>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
